version: 2
updates:
  # Node/TypeScript dependencies (pnpm-lock.yaml is handled via the "npm" ecosystem)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Major version bumps are intentionally left ungrouped so they surface
    # as individual PRs for manual review.

  # GitHub Actions used in CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
