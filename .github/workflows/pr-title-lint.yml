name: PR title lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
