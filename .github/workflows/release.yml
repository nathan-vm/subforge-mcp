name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # OIDC token for npm trusted publishing (no NPM_TOKEN secret needed) —
  # requires a Trusted Publisher configured on the package at npmjs.com
  # (workflow filename: release.yml).
  id-token: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # main requires a PR for every update (branch ruleset), which
          # blocks the default GITHUB_TOKEN push done by @semantic-release/git
          # (it's attributed to github-actions[bot], not a bypassable actor
          # on a personal repo). RELEASE_TOKEN is a fine-grained PAT
          # (Contents: read/write only) belonging to a repo admin, who is
          # on the ruleset's bypass list.
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm CLI >=11.5.1; setup-node's bundled npm
      # is not guaranteed to satisfy that yet.
      - run: npm install -g npm@latest

      - run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
